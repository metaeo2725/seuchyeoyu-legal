<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>약관과 정책 · 스쳐유</title>
<style>:root{--bg:#F6F0EA;--surface:#FFFFFF;--line:#E6D9D3;--fg:#2B2230;--sub:#5F5363;--mute:#7A6E7B;--accent:#B4372B;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1C1720;--surface:#26202B;--line:#3D3442;--fg:#F3ECEF;--sub:#C4B8C6;--mute:#9A8E9C;--accent:#FF9384;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:16px/1.75 "Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
main{max-width:720px;margin:0 auto;padding:40px 16px 72px}
.brand{font-weight:700;color:var(--accent);letter-spacing:.02em;margin:0 0 8px}
h1{font-size:28px;line-height:1.35;margin:0 0 6px}
.meta{color:var(--mute);font-size:14px;margin:0 0 28px}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 20px;margin:0 0 32px}
.summary div{padding:12px 0;border-top:1px solid var(--line)}
.summary div:first-child{border-top:0}
.summary b{display:block}
.summary span{color:var(--sub);font-size:15px}
section{margin:0 0 26px}
h2{font-size:18px;margin:0 0 6px}
section p{margin:0;color:var(--sub)}
nav{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 28px}
nav a,.links a{color:var(--accent);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px}
.links{display:flex;flex-direction:column;gap:12px;margin-top:24px}
.links a{border-radius:14px;padding:16px 18px;font-size:16px}
footer{color:var(--mute);font-size:13px;border-top:1px solid var(--line);padding-top:16px;margin-top:40px}
</style></head>
<body><main>
<p class="brand">스쳐유</p>
<h1>약관과 정책</h1>
<p class="meta">앱 안의 내용과 같아요. 앱에서는 내 정보 메뉴에서 볼 수 있어요.</p>
<div class="links">
<a href="privacy/">개인정보 처리방침 · 시행 2026-11-26</a>
<a href="location-terms/">위치기반서비스 이용약관 · 시행 2026-11-25</a>
</div>
<footer>스쳐유 · 한양대학교 ERICA 재학생 전용 근처 만남 앱</footer>
</main></body></html>
